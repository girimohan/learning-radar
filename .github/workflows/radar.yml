name: Learning radar

on:
  schedule:
    - cron: "23 4 * * 1,3,5"   # Mon, Wed, Fri at 06:23 Helsinki in winter, 07:23 in summer
    - cron: "53 9 * * 1"       # backup on Mondays: GitHub sometimes skips scheduled runs
  workflow_dispatch:
    inputs:
      digest:
        description: "Send the digest issue now, whatever the weekday"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: learnradar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Collect, classify and score, rebuild the pages
        id: radar
        run: python -m learnradar run
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/seen.json digests/latest.md
          git diff --cached --quiet || git commit -m "Radar: ${{ steps.radar.outputs.shown }} offers, ${{ steps.radar.outputs.new_this_week }} new this week"
          git push
      - name: Send the weekly digest (opens an issue, which GitHub emails to you)
        # Mondays (once: the backup run only sends it if the morning run did not), or when run by hand.
        if: github.event_name == 'workflow_dispatch' && inputs.digest || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" != "1" ]; then
            echo "Not Monday: no digest today."; exit 0
          fi
          TITLE="Learning radar $(date -u +%F)"
          SENT=$(gh issue list --state all --search "\"$TITLE\" in:title" --json number --jq length)
          if [ "$SENT" = "0" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh issue create \
              --title "$TITLE: ${{ steps.radar.outputs.new_this_week }} new, ${{ steps.radar.outputs.closing_soon }} deadlines soon" \
              --body-file digests/latest.md
          fi
