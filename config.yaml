# Offers that match no field still appear (for "learn something new"), with this weight.
untopical_weight: 0.5

# Titles containing these words are dropped.
exclude_title: [demo, test course, testikurssi, "(archived)", retired]

scoring:
  # Each part is 0-1; the score is their weighted sum (weights should add up to 1), times 100.
  credential: 0.28     # what you walk away with: degree > qualification > certification > credits > nothing
  cost: 0.30           # free and publicly funded first, free-to-audit next, fees last
  field: 0.22          # the matched field's weight (above)
  timing: 0.12         # you can apply now, or start any time, beats "opens later"
  flexibility: 0.08    # online, evening/weekend, or self-paced fits people who work
  new_bonus: 4         # extra points for offers first seen in the last 7 days
  closing_bonus: 4     # extra points when the deadline is within 21 days

# Offers below this score are dropped. Most land between 35 and 85.
min_score: 30
# The dashboard gets at most this many offers (the best ones). Each source is capped too (below).
max_items: 13000
new_days: 7          # "new" means first seen this many days ago or less
closing_days: 21     # "closing soon" means the deadline is this close

digest:
  top_new: 15
  top_free_finland: 12
  top_closing: 12
  top_degrees: 8

# --------------------------------------------------------------------------- sources
sources:
  opintopolku:
    # All Finnish education: universities, universities of applied sciences, open university, vocational
    # colleges, Jotpa-funded free training, labour market training, folk high schools...
    enabled: true
    page_size: 200
    delay_seconds: 3          # pause between requests, to be gentle with a public service
    windows: [open, upcoming] # open = application open now, upcoming = opens within 30 days
    skip_types: [lk, taiteen-perusopetus, vaativan-tuen-koulutukset, tuva-erityisopetus]
    max_items: 4000
  daad:
    # Degree programmes, language courses and summer schools in Germany (the DAAD database of
    # international programmes; most are taught in English, public universities usually charge no tuition).
    enabled: true
    page_size: 500
    max_items: 2600
  futurelearn:
    # Online courses from European (mostly UK) universities and institutions.
    enabled: true
    max_items: 1200
  coursera:
    # Specialisations and Professional Certificates (multi-course programmes aimed at a job role).
    # include_courses adds the ~26,000 single courses as well; that makes the dashboard much bigger.
    enabled: true
    include_courses: false
    max_items: 1000
  mslearn:
    # Microsoft Learn: free learning paths, free Applied Skills credentials, and certifications (paid exam).
    enabled: true
    learning_paths: 250       # the most popular N learning paths
    max_items: 450
  sweden:
    # Skolverket's Susa-navet: university courses and programmes (HS), higher vocational education (YH, free),
    # labour market training (AUB) and folk high schools (FHS). University runs are only read when added or
    # updated in the last hs_days days (there are ~64,000 in all).
    enabled: true
    school_types: [HS, YH, AUB, FHS]
    hs_days: 60
    max_items: 3500
    max_per_group: {HS: 2000}   # university runs, so YH, labour market training and folk high schools keep room
  norway:
    # Utdanning.no: higher education programmes in the national admission, and vocational colleges (fagskole).
    enabled: true
    fagskole: true
    max_items: 2200
  moocfi:
    # MOOC.fi, the University of Helsinki's free online courses (Elements of AI, programming, ...).
    enabled: true
    max_items: 150
