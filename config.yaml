# Everything you are likely to tune lives in this file.
# Edit, commit, and the next scheduled run picks it up.

# Fields people study for. Each offer is matched against these keywords (title counts most, then the
# provider's own subject labels, then the description). Every field whose keywords appear is listed on the
# offer; the best weight is used for ranking. "weight" (0-1) is how strongly the field lifts an offer: use it
# to favour fields with good job prospects. A keyword ending in * matches any word that starts with it,
# which is how Finnish inflections are caught ("ohjelmoi*" matches ohjelmointi, ohjelmoinnin...).
